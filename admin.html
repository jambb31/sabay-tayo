<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | Sabay-Tayo TSU Tricycle Fare Splitter</title>
  <meta name="theme-color" content="#0a2a66">
  <meta name="description" content="Admin page for verifying tricycle drivers.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛺</text></svg>">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="bar">
      <span class="logo"><img class="mark" src="logo-icon.png" alt="" width="36" height="36">Sabay-Tayo</span>
      <div class="bar-right">
        <div id="session" hidden>
          <span id="who"></span>
          <button class="btn light" id="logout" type="button">Sign out</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <h1>Driver verification</h1>

    <div class="card">
      <div class="scroll">
        <table>
          <caption>Registered drivers</caption>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Plate</th>
              <th>License</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p id="empty" class="msg" hidden>No drivers have signed up yet.</p>
    </div>

    <div id="photobox" class="photobox" hidden>
      <img id="pic" alt="">
      <button class="btn" id="closepic" type="button">Close</button>
    </div>
  </main>

  <footer>
    <p>Sabay-Tayo for TSU students. Web Development final term project.</p>
  </footer>

  <script type="module" src="admin.js"></script>
</body>
</html>
