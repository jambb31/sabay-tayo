<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lobbies | Sabay-Tayo TSU Tricycle Fare Splitter</title>
<meta name="description" content="Browse open ride groups at TSU gates or create your own group.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛺</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css"></head><body>
<header><div class="bar"><span class="logo">🛺 Sabay-Tayo</span><nav aria-label="Main menu"><ul>
<li><a href="index.html">Home</a></li>
<li><a id="authlink" href="auth.html">Sign in</a></li>
<li data-role="student" hidden><a class="active" href="lobbies.html">Lobbies</a></li>
<li data-role="student" hidden><a href="waiting-room.html">Waiting room</a></li>
<li data-role="driver" hidden><a href="driver.html">Driver</a></li>
</ul></nav></div></header><main>
<h1>Ride lobbies</h1>
<label for="q">Search by destination</label><input id="q" type="search" placeholder="Magic Star">
<div class="grid" id="list" aria-live="polite" style="margin-top:14px"></div>
<h2 style="margin-top:28px">Create a new group</h2>
<form id="form" class="card"><label for="gate">Pickup gate</label><select id="gate" name="origin"></select>
<label for="destination">Destination</label><input id="destination" name="destination" list="places" required><datalist id="places"></datalist>
<label for="time">Departure time</label><input id="time" name="time" type="time" required>
<p class="msg err" id="msg" role="alert"></p><button class="btn" type="submit">Create group</button></form>
<script type="module">
import {groups,onSnapshot,query,orderBy,addDoc,serverTimestamp,FARES,GATES,joinGroup,watchUser,esc} from "./app.js";
const user=await watchUser("student"); let data=[];
gate.innerHTML=GATES.map(g=>`<option>${g}</option>`).join("");
places.innerHTML=Object.keys(FARES).map(k=>`<option value="${k}">`).join("");
// Real-time feed: runs again every time any student creates or joins a group.
onSnapshot(query(groups,orderBy("createdAt","desc")),s=>{data=s.docs.map(d=>({id:d.id,...d.data()}));draw()},e=>list.textContent="Database error: "+e.message);
function draw(){const k=q.value.toLowerCase(), rows=data.filter(g=>g.status==="open"&&g.destination.toLowerCase().includes(k));
 list.innerHTML=rows.length?rows.map(g=>{const n=g.members.length;
  return `<article class="card"><span class="badge ${n>=3?"urgent":""}">${n>=3?"Urgent":"Joinable"}</span><h3>${esc(g.origin)} to ${esc(g.destination)}</h3><p>Leaves at ${esc(g.time)}. ${n}/4 seats taken.</p><button class="btn" data-id="${g.id}">Join group</button></article>`}).join(""):"<p>No open groups yet. Create the first one below.</p>"}
q.oninput=draw;
list.onclick=async e=>{const id=e.target.dataset.id;if(!id)return;try{await joinGroup(id,user);location.href="waiting-room.html?id="+id}catch(x){alert(x.message)}};
form.onsubmit=async e=>{e.preventDefault();const dest=destination.value.trim();
 if(!FARES[dest]) return msg.textContent="Pick a destination from the list.";
 const ref=await addDoc(groups,{origin:gate.value,destination:dest,time:time.value,fare:FARES[dest],members:[{name:user.name,email:user.email}],status:"open",createdAt:serverTimestamp()});
 location.href="waiting-room.html?id="+ref.id};
</script>
</main><footer><p>Sabay-Tayo for TSU students. Web Development final term project.</p></footer></body></html>
