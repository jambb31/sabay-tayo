<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passenger groups | Sabay-Tayo TSU Tricycle Fare Splitter</title>
  <meta name="theme-color" content="#0a2a66">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sabay-Tayo">
  <meta name="description" content="Browse ride groups at TSU gates, create your own with a departure time, and split the fare.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛺</text></svg>">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="bar">
      <span class="logo"><span class="mark">S</span>Sabay-Tayo</span>
      <div class="bar-right">
        <button class="btn light" id="install" type="button" hidden>Install app</button>
        <div id="session" hidden>
          <span id="who"></span>
          <button class="btn light" id="logout" type="button">Sign out</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div id="mine" hidden></div>

    <div id="browse" hidden>
      <h1>Groups at TSU gates</h1>
      <div class="grid" id="list" aria-live="polite"></div>
      <p>
        <button class="btn" id="open" type="button">+ Create a group</button>
      </p>

      <h2>Fares</h2>
      <div id="fares" class="card"></div>

      <h2>Fare splitter</h2>
      <div id="splitter" class="card">
        <p class="small">Try a ride before you join. Add each passenger's discount and load, and see who pays what.</p>

        <label for="sgate">From</label>
        <select id="sgate"></select>

        <label for="sdest">To</label>
        <select id="sdest"></select>

        <label for="scount">Passengers</label>
        <select id="scount">
          <option>1</option>
          <option>2</option>
          <option selected>3</option>
          <option>4</option>
        </select>

        <div id="srows"></div>
        <div id="sresult"></div>
      </div>
    </div>

    <div id="formv" hidden>
      <h1>New group</h1>
      <form id="form" class="card">
        <label for="gate">From</label>
        <select id="gate"></select>

        <label for="dest">To</label>
        <select id="dest"></select>

        <label for="time">Departure time</label>
        <input id="time" type="time" required>

        <p class="small">
          Members
          <span class="av" id="me"></span>
          <span class="av empty">+</span>
          <span class="av empty">+</span>
          <span class="av empty">+</span>
          1/4
        </p>
        <p class="msg" id="hint"></p>
        <p class="small" id="rates"></p>
        <p class="msg err" id="msg" role="alert"></p>

        <button class="btn" type="submit">Create a group</button>
        <button class="btn light line" id="cancelform" type="button">Cancel</button>
      </form>
    </div>
  </main>

  <footer>
    <p>Sabay-Tayo for TSU students. Web Development final term project.</p>
  </footer>

  <script src="pwa.js" defer></script>
  <script type="module" src="student.js"></script>
</body>
</html>
