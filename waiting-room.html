<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waiting room | Sabay-Tayo TSU Tricycle Fare Splitter</title>
<meta name="description" content="Watch your seats fill up live and see your equal fare split.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛺</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css"></head><body>
<header><div class="bar"><span class="logo">🛺 Sabay-Tayo</span><nav aria-label="Main menu"><ul>
<li><a href="index.html">Home</a></li>
<li><a id="authlink" href="auth.html">Sign in</a></li>
<li data-role="student" hidden><a href="lobbies.html">Lobbies</a></li>
<li data-role="student" hidden><a class="active" href="waiting-room.html">Waiting room</a></li>
<li data-role="driver" hidden><a href="driver.html">Driver</a></li>
</ul></nav></div></header><main>
<h1>Waiting room <span id="code"></span></h1>
<div id="box"><p id="route"></p>
<div class="dots" id="dots" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
<p><strong id="seats"></strong> seats taken. <span id="state"></span></p>
<div class="banner" id="banner" hidden>Group full. Head to the terminal.</div>
<img id="qr" width="160" height="160" alt="QR code to open this group">
<section id="split" hidden><table><caption>Fare split (total PHP <span id="total"></span>)</caption><thead><tr><th>Passenger</th><th>Pays</th></tr></thead><tbody id="rows"></tbody></table>
<div class="radios"><label><input type="radio" name="pay" checked> Cash</label><label><input type="radio" name="pay"> GCash</label></div></section>
<p style="margin-top:12px"><button class="btn green" id="test">Add test rider (demo)</button><button class="btn red" id="cancel">Leave group</button></p>
<details class="card"><summary>Report an issue</summary><label for="issue">What happened?</label><textarea id="issue" rows="3"></textarea><button class="btn" id="send">Send report</button></details></div>
<script type="module">
import {db,collection,addDoc,doc,onSnapshot,joinGroup,leaveGroup,watchUser,esc,serverTimestamp} from "./app.js";
const user=await watchUser("student"), id=new URLSearchParams(location.search).get("id");
if(!id) location.href="lobbies.html";
onSnapshot(doc(db,"groups",id),s=>{
 if(!s.exists()){box.innerHTML='<p>This group is gone. <a href="lobbies.html">Back to lobbies</a></p>';return}
 const g=s.data(),n=g.members.length,full=n===4;
 code.textContent="#"+id.slice(0,6).toUpperCase();
 route.textContent=`${g.origin} to ${g.destination} at ${g.time}`;
 seats.textContent=n+"/4"; dots.className="dots"+(full?" full":"");
 [...dots.children].forEach((d,i)=>d.className=i<n?"on":"");
 banner.hidden=split.hidden=!full; test.hidden=full;
 state.textContent=g.status==="accepted"?"A driver accepted your group.":g.status==="done"?"Trip finished.":"";
 total.textContent=g.fare;
 rows.innerHTML=g.members.map(p=>`<tr><td>${esc(p.name)}</td><td>PHP ${g.fare/4}</td></tr>`).join("");
 qr.src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data="+encodeURIComponent(location.href);
});
test.onclick=()=>joinGroup(id,{name:"Test rider "+Math.floor(Math.random()*90+10),email:"test"+Date.now()+"@demo"}).catch(e=>alert(e.message));
cancel.onclick=async()=>{await leaveGroup(id,user);location.href="lobbies.html"};
send.onclick=async()=>{if(!issue.value.trim())return;await addDoc(collection(db,"reports"),{groupId:id,by:user.email,text:issue.value,createdAt:serverTimestamp()});issue.value="";alert("Report sent.")};
</script>
</main><footer><p>Sabay-Tayo for TSU students. Web Development final term project.</p></footer></body></html>
